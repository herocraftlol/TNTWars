# Configuration générale de TntWars

game:
  countdown-seconds: 30
  min-players-to-start: 2
  restarting-seconds: 8
  post-game-seconds: 5
  default-teams: 2
  default-team-size: 4
  friendly-fire: false
  spectator-fall-y-offset: 0

waiting-room:
  diamond-slot: 0
  color-item-slot: 4
  leave-item-slot: 8

points:
  kill: 15
  win: 50
  tnt-launched: 1
  enemy-block-destroyed: 2
  cannon-functional-bonus: 25

levels:
  thresholds: [0, 50, 150, 300, 600, 1000, 1500, 2200, 3000]

schematics:
  preview-seconds: 25

messages:
  prefix: "&8[&cTNT&fWars&8] &r"

storage:
  stats-file: "stats.yml"
  arenas-file: "arenas.yml"
  tournaments-file: "tournaments.yml"
